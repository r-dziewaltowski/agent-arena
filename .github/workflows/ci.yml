name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generates Next.js route types (e.g. LayoutProps) first; they live in .next/, which a
      # fresh checkout doesn't have.
      - name: Type check
        run: npm run typecheck

      # Tests use a fake model, so no Ollama or API keys are needed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
