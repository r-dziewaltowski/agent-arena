name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generates Next.js route types (e.g. LayoutProps) first; they live in .next/, which a
      # fresh checkout doesn't have.
      - name: Type check
        run: npm run typecheck

      # Tests use a fake model, so no Ollama or API keys are needed.
      - name: Test
        run: npm test

      # Better Auth refuses its built-in default secret in production builds. This placeholder
      # only lets CI build; it is not used by any deployment.
      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret-0000

  # A real browser against a production build with a fake model and the QStash dev server (which
  # scripts/e2e-server.ts starts in Docker). Configuration: e2e/env.ts and playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
